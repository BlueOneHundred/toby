<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E4A43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="__SHORT__">
<meta name="robots" content="noindex, nofollow">
<title>__TITLE__</title><link rel="icon" href="/favicon.ico" sizes="48x48"><link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/*__FONTS__*/
:root{
  --pine:#156A5F; --deep:#0E4A43; --deeper:#0A3832; --marigold:#F2B23E; --marigold-dark:#B87A0C; --ink:#1B2530; --soft:#55626C;
  --mint:#E7F2EF; --mint-line:#C7DDD8; --mint-mid:#D5E8E3; --butter:#FFF3D4; --butter-line:#F0D89A; --paper:#FFFFFF;
  --pine-tint:#9CC7BF; --pine-text:#CFE6E1; --red:#A63A28; --red-tint:#FBEAE5; --red-line:#EBC2B8;
  --display:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif; --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mint);color:var(--ink);font-family:var(--display);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit;-webkit-tap-highlight-color:transparent}
a{color:var(--pine)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
#view{min-height:100vh;padding:20px 18px 110px}
@media (min-width:640px) and (max-width:899px){#view{padding:26px 28px 120px}}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--mint-line);display:flex;justify-content:space-around;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.tabs button{flex:1;max-width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;border-radius:14px;font-size:12px;font-weight:500;color:var(--soft)}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--deep);font-weight:700}
.tabs button[aria-current=page] .ic{background:var(--marigold)}
.tabs .ic{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.rail{display:none}
@media (min-width:900px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:264px;background:var(--deep);color:#fff;padding:26px 18px;overflow:auto}
  .rail .brand{display:flex;gap:14px;align-items:center;margin-bottom:26px;padding:0 6px}
  .rail .brand img{width:58px;height:86px;object-fit:cover;border-radius:6px;border:2px solid var(--marigold)}
  .rail .brand b{display:block;font-size:19px;line-height:1.15;font-weight:700}
  .rail .brand span{display:block;font-size:12.5px;color:var(--pine-text);margin-top:5px;line-height:1.3}
  .rail nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;color:var(--pine-text);font-weight:500;font-size:15.5px}
  .rail nav button svg{width:22px;height:22px;flex:none}
  .rail nav button:hover{background:var(--pine)}
  .rail nav button[aria-current=page]{background:var(--marigold);color:var(--ink);font-weight:700}
  .rail .sub{margin:2px 0 8px 34px;border-left:2px solid var(--pine);padding-left:6px}
  .rail .sub button{padding:7px 10px;font-size:14px}
  .rail .sub button[aria-current=page]{background:var(--pine);color:#fff}
  .rail .foot{margin-top:auto;font-size:12.5px;color:var(--pine-tint);padding:16px 8px 0;line-height:1.4}
  #view{margin-left:264px;padding:38px 48px 80px}
}
.col{display:block}

/* ---------- common ---------- */
.pagehead{margin:6px 0 18px}
.pagehead h1{font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
.pagehead p{color:var(--soft);margin-top:6px;font-size:15.5px;max-width:56ch}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--pine);font-weight:600;font-size:15px;padding:8px 10px 8px 0;margin-bottom:4px}
.back svg{width:18px;height:18px}
.card{background:var(--paper);border:1px solid var(--mint-line);border-radius:20px;padding:18px}
.card+.card,.stack>*+*{margin-top:14px}
.card h2{font-size:19px;font-weight:700;line-height:1.2}
.card .hint{color:var(--soft);font-size:14.5px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:24px;font-weight:700;font-size:16px;background:var(--pine);color:#fff}
.btn:hover{background:var(--deep)}
.btn.gold{background:var(--marigold);color:var(--ink)}
.btn.gold:hover{background:#F6C262}
.btn.line{background:var(--paper);color:var(--deep);border:2px solid var(--pine)}
.btn.line:hover{background:var(--mint)}
.btn.danger{background:var(--paper);color:var(--red);border:2px solid var(--red-line)}
.btn.small{min-height:40px;padding:0 15px;font-size:14.5px}
.btn svg{width:20px;height:20px}
a.btn{text-decoration:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:block}
.field>span{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
.input,textarea.input{width:100%;min-height:48px;border:1.5px solid var(--mint-line);border-radius:12px;background:var(--paper);padding:11px 13px;font-size:16px}
.input:focus{outline:none;border-color:var(--pine);box-shadow:0 0 0 3px var(--mint-mid)}
textarea.input{resize:vertical;line-height:1.4}
.seg{display:flex;background:var(--mint);border:1px solid var(--mint-line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:600;font-size:14.5px;color:var(--soft);text-align:center;padding:4px 6px;line-height:1.15}
.seg button[aria-pressed=true]{background:var(--pine);color:#fff}
.subnav{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:2px 18px 6px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:none;min-height:42px;padding:0 16px;border-radius:21px;background:var(--paper);border:1px solid var(--mint-line);font-weight:600;font-size:14.5px;color:var(--soft)}
.subnav button[aria-current=page]{background:var(--deep);border-color:var(--deep);color:#fff}
@media (min-width:900px){.subnav{display:none}}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--pine);background:var(--paper);display:flex;align-items:center;justify-content:center}
.tick svg{width:18px;height:18px;stroke:var(--paper)}
.tick[aria-pressed=true],.tick.on{background:var(--pine)}
.tick[aria-pressed=true] svg,.tick.on svg{stroke:#fff}
.box{border-radius:9px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin:0 1px;border-radius:10px;background:var(--mint-mid);color:var(--deep);font-family:var(--display);font-size:11.5px;font-weight:700;vertical-align:.18em;line-height:1}
.cite:hover{background:var(--pine);color:#fff}
.on-dark .cite{background:var(--pine);color:#fff}
.on-gold .cite{background:var(--paper)}

/* ---------- today ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:4px 0 14px}
.hello h1{font-size:26px;font-weight:700;line-height:1.1}
.hello p{color:var(--soft);font-size:14.5px;margin-top:4px}
.hero{background:var(--deep);color:#fff;border-radius:28px;padding:22px 22px 24px;position:relative;overflow:hidden}
.hero .num{font-size:128px;line-height:.82;font-weight:800;color:var(--marigold);letter-spacing:-.04em;margin-left:-4px}
.hero .of{font-size:15px;color:var(--pine-text);font-weight:500;margin-bottom:10px}
.hero h2{font-size:28px;font-weight:700;line-height:1.1;margin-top:14px}
.hero .txt{font-family:var(--serif);font-size:17.5px;line-height:1.5;color:#fff;margin-top:8px;max-width:52ch}
.hero .row{margin-top:18px}
.hero .quiet{color:var(--pine-text);font-size:14px;font-family:var(--serif);font-style:italic;margin-top:14px;max-width:46ch}
.pips{display:grid;grid-template-columns:repeat(30,1fr);gap:3px;margin-top:20px}
.pips i{height:8px;border-radius:4px;background:var(--pine)}
.pips i.on{background:var(--marigold)}
.pips i.now{background:#fff}
.weeklabels{display:grid;grid-template-columns:7fr 7fr 7fr 9fr;gap:3px;font-size:11.5px;color:var(--pine-text);margin-top:6px}
@media (min-width:640px){
  .hero{padding:30px 34px 32px;display:grid;grid-template-columns:auto 1fr;column-gap:34px;align-items:start}
  .hero .numwrap{grid-row:1 / span 2}
  .hero .num{font-size:190px}
  .hero h2{margin-top:6px;font-size:34px}
  .hero .foot{grid-column:1 / -1}
}
.grid2{display:grid;gap:14px;margin-top:14px}
@media (min-width:1000px){.grid2{grid-template-columns:1fr 1fr}.grid2>.card{margin-top:0}}
.grid2>.card{margin-top:0}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.quick button{min-height:54px;border-radius:14px;background:var(--mint);border:1.5px solid var(--mint-line);font-weight:700;font-size:15px;text-align:center;color:var(--deep)}
.quick button:hover{background:var(--mint-mid)}
.quick button:active{background:var(--pine);color:#fff}
.since{display:flex;align-items:baseline;gap:8px;margin-top:12px}
.since b{font-size:30px;font-weight:800;color:var(--pine);line-height:1}
.since span{color:var(--soft);font-size:14.5px}
.fact{background:var(--butter);border:1px solid var(--butter-line);border-radius:20px;padding:18px}
.fact h2{font-size:15px;font-weight:700;color:var(--marigold-dark)}
.fact p{font-family:var(--serif);font-size:18px;line-height:1.45;margin-top:6px}
.fact .more{margin-top:12px}
.linkbtn{color:var(--pine);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:5px;padding:6px 0}
.linkbtn svg{width:17px;height:17px}
.next-read{display:flex;gap:16px;align-items:center;width:100%}
.next-read .n{font-size:54px;font-weight:800;color:var(--pine);line-height:.9;min-width:44px;letter-spacing:-.03em}
.next-read b{display:block;font-size:18px;line-height:1.2}
.next-read span{display:block;color:var(--soft);font-size:14px;margin-top:3px}

/* ---------- plan ---------- */
.week{margin-top:22px}
.weekhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.weekhead .wk{font-size:22px;font-weight:700;line-height:1.1}
.weekhead p{color:var(--soft);font-size:14.5px;margin-top:3px}
.weekhead .count{margin-left:auto;flex:none;font-weight:700;font-size:14px;color:var(--deep);background:var(--mint-mid);border-radius:14px;padding:5px 11px}
.days{background:var(--paper);border:1px solid var(--mint-line);border-radius:20px;overflow:hidden}
.day{display:flex;gap:14px;padding:14px 16px;align-items:flex-start;width:100%;border-top:1px solid var(--mint);position:relative}
.day:first-child{border-top:0}
.day .dn{flex:none;width:34px;font-size:26px;font-weight:800;line-height:1.05;color:var(--pine);text-align:center;letter-spacing:-.02em}
.day .body{flex:1;min-width:0}
.day b{font-size:17px;font-weight:700;display:block;line-height:1.25}
.day p{font-family:var(--serif);font-size:16px;line-height:1.45;margin-top:3px;color:var(--ink)}
.day.done b,.day.done p{color:var(--soft)}
.day.done .dn{color:var(--pine-tint)}
.day.now{background:var(--butter)}
.day.now::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--marigold)}
.day .tick{margin-top:2px}

/* ---------- trackers ---------- */
.strip{position:relative;height:56px;background:var(--mint);border:1px solid var(--mint-line);border-radius:14px;margin-top:14px}
.strip .hr{position:absolute;top:0;bottom:0;width:1px;background:var(--mint-line)}
.strip .dot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--pine);border:2px solid var(--paper)}
.dot.poo{background:var(--marigold)} .dot.both{background:var(--deep)} .dot.nothing{background:var(--paper);border-color:var(--soft)}
.dot.in{box-shadow:0 0 0 3px var(--red)}
.striplabels{display:flex;justify-content:space-between;font-size:12px;color:var(--soft);margin-top:5px;padding:0 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--soft);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--pine);display:inline-block}
.daypick{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daypick b{font-size:17px}
.daypick button{width:44px;height:44px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center}
.daypick button svg{width:20px;height:20px}
.daypick button:disabled{color:var(--mint-line);cursor:default}
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--mint)}
.entry .t{flex:none;width:76px;font-weight:700;font-size:15px}
.entry .what{flex:1;min-width:0}
.entry .what b{display:block;font-size:16px}
.entry .what>span{display:block;color:var(--soft);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.entry .del{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--soft)}
.entry .del:hover{background:var(--red-tint);color:var(--red)}
.entry .del svg{width:18px;height:18px}
.tag{display:inline-block;white-space:nowrap;font-size:12.5px;font-weight:700;border-radius:9px;padding:2px 8px;background:var(--red-tint);color:var(--red);margin-left:6px;vertical-align:.1em}
.empty{color:var(--soft);font-family:var(--serif);font-size:16.5px;padding:14px 0 4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.statbox{background:var(--deep);color:#fff;border-radius:20px;padding:16px 18px}
.statbox b{display:block;font-size:40px;font-weight:800;color:var(--marigold);line-height:1;letter-spacing:-.02em}
.statbox span{display:block;font-size:13.5px;color:var(--pine-text);margin-top:7px;line-height:1.35}
.skill{padding:16px 0;border-top:1px solid var(--mint)}
.skill:first-of-type{border-top:0;padding-top:4px}
.skill b{font-size:16.5px;font-weight:600;display:block;margin-bottom:10px}
.wkbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wkbtns button{min-height:44px;border-radius:12px;border:1.5px solid var(--mint-line);background:var(--paper);font-size:13.5px;font-weight:600;color:var(--soft);display:flex;align-items:center;justify-content:center;gap:5px}
.wkbtns button svg{width:15px;height:15px;display:none}
.wkbtns button[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.wkbtns button[aria-pressed=true] svg{display:block}
@media (min-width:700px){.skill{display:grid;grid-template-columns:1fr 380px;gap:18px;align-items:center}.skill b{margin:0}}
.daychips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:16px}
.daychips button{min-height:46px;border-radius:12px;background:var(--paper);border:1px solid var(--mint-line);font-weight:700;font-size:14px;text-align:center;color:var(--soft)}
.daychips button[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:#fff}
.daychips button.has{box-shadow:inset 0 -4px 0 var(--marigold)}
.slot{margin-top:14px}
.slot label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.slot label small{display:block;font-weight:400;color:var(--soft);font-size:13.5px}
.plangrid{display:none}
@media (min-width:1000px){
  .planphone{display:none}
  .plangrid{display:grid;grid-template-columns:170px repeat(7,1fr);background:var(--paper);border:1px solid var(--mint-line);border-radius:20px;overflow:hidden}
  .plangrid>div{border-top:1px solid var(--mint);border-left:1px solid var(--mint);padding:0}
  .plangrid .h{background:var(--deep);color:#fff;font-weight:700;padding:11px 12px;font-size:14.5px;border:0;text-align:center}
  .plangrid .r{padding:12px;font-weight:600;font-size:14px;border-left:0;background:var(--mint);line-height:1.25}
  .plangrid .r small{display:block;font-weight:400;color:var(--soft);font-size:12.5px;margin-top:3px}
  .plangrid textarea{width:100%;height:100%;min-height:84px;border:0;background:var(--paper);padding:10px;font-size:14px;resize:none;display:block;line-height:1.35;font-family:var(--serif)}
  .plangrid textarea:focus{outline:none;background:var(--butter)}
}
.soc{padding:16px 0;border-top:1px solid var(--mint)}
.soc:first-of-type{border-top:0;padding-top:4px}
.soc .top{display:flex;gap:12px;align-items:flex-start}
.soc .top b{font-size:16.5px;font-weight:600;flex:1;padding-top:5px}
.soc .fields{margin:12px 0 0 46px;display:grid;gap:10px}
.soc .feel{display:flex;gap:6px;flex-wrap:wrap}
.soc .feel button{min-height:40px;padding:0 13px;border-radius:20px;border:1.5px solid var(--mint-line);font-size:14px;font-weight:600;color:var(--soft);background:var(--paper)}
.soc .feel button[aria-pressed=true]{background:var(--pine);border-color:var(--pine);color:#fff}
.soc .feel button.worried[aria-pressed=true]{background:var(--marigold);border-color:var(--marigold);color:var(--ink)}
.soc .feel button.later[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
@media (min-width:700px){.soc .fields{grid-template-columns:170px 1fr;align-items:center}.soc .fields .feel{grid-column:1 / -1}}
.todo{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--mint)}
.todo span{flex:1;font-size:16.5px;overflow-wrap:anywhere;font-family:var(--serif)}
.todo.done span{color:var(--soft);text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips button{min-height:38px;padding:0 13px;border-radius:19px;background:var(--mint);border:1px dashed var(--pine-tint);font-size:14px;font-weight:600;color:var(--deep)}

/* ---------- read ---------- */
.shelf{background:var(--deep);border-radius:28px;color:#fff;padding:20px;display:flex;gap:18px;align-items:center}
.shelf img{width:112px;height:167px;object-fit:cover;border-radius:8px;border:3px solid var(--marigold);flex:none;background:var(--pine)}
.coverwrap{flex:none;line-height:0}
.shelf h1{font-size:28px;font-weight:700;line-height:1.05}
.shelf p{color:var(--pine-text);font-size:14.5px;margin-top:8px;line-height:1.35}
.shelf .seal{display:inline-block;margin-top:12px;background:var(--marigold);color:var(--ink);border-radius:14px;font-weight:700;font-size:13px;padding:5px 11px}
@media (min-width:640px){.shelf{padding:28px 30px;gap:28px}.shelf img{width:150px;height:224px}.shelf h1{font-size:40px}.shelf p{font-size:16.5px}}
.toc{margin-top:16px;background:var(--paper);border:1px solid var(--mint-line);border-radius:20px;overflow:hidden}
.toc button{display:flex;gap:16px;align-items:center;width:100%;padding:15px 16px;border-top:1px solid var(--mint)}
.toc button:first-child{border-top:0}
.toc button:hover{background:var(--mint)}
.toc .n{flex:none;width:46px;font-size:38px;font-weight:800;color:var(--pine);line-height:.9;letter-spacing:-.03em;text-align:center}
.toc .n.sm{font-size:0}
.toc .n.sm svg{width:24px;height:24px;stroke:var(--pine)}
.toc b{display:block;font-size:17.5px;line-height:1.2}
.toc span.s{display:block;color:var(--soft);font-size:14px;margin-top:3px;line-height:1.35}
.toc .readmark{margin-left:auto;flex:none;width:26px;height:26px;border-radius:50%;background:var(--pine);display:flex;align-items:center;justify-content:center}
.toc .readmark svg{width:14px;height:14px;stroke:#fff}
.opener{background:var(--deep);color:#fff;border-radius:28px;padding:24px 22px 26px}
.opener .opic{border-radius:18px;overflow:hidden;aspect-ratio:16/10;margin-bottom:18px;background:var(--pine)}
.opener .opic img,.opener .opic svg{display:block;width:100%;height:100%;object-fit:cover}
.opener.haspic .big{font-size:96px}
.fig{margin:22px 0}
.fig img{display:block;width:100%;height:auto;border-radius:16px;background:var(--mint)}

const BOOK = "__BOOK_DATA__";

/* ================= icons ================= */

const IC = {

  pot: I('<path d="M4 10h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2.500 10h19M9 6.500c0-1 .8-1.500.8-2.500M13 6.500c0-1 .8-1.500.8-2.500"/>'),
  timer: I('<circle cx="12" cy="13.500" r="7.500"/><path d="M12 9.500v4l2.500 2M9.500 2.500h5"/>'),
  spool: I('<circle cx="12" cy="12" r="8.500"/><path d="M5.500 7.500c4 1 9 1 13 0M4 12c5 1.500 11 1.500 16 0M5.500 16.500c4-1 9-1 13 0"/>'),
  flame: I('<path d="M12 21c-3.900 0-6.500-2.600-6.500-6 0-3.500 2.500-5.500 3.500-8.500 1.500 1.500 2 3 2 4.500 1.300-.6 2.300-2 2.500-3.800 2.400 2 4 4.600 4 7.800 0 3.400-2.600 6-5.500 6z"/>'),

/* ================= storage ================= */
const KEY = 'companion:' + BOOK.slug;
const blank = () => ({ v: 1, name: '', start: '', seen: false, days: {}, skills: {}, planner: {}, list: [], read: {}, tried: {}, checks: {}, serves: {}, done: {}, habits: {}, weekdone: {}, updated: 0 });
let S = blank(), storeOK = true;
function load() {
  try {
    const t = localStorage.getItem(KEY);
    if (t) S = Object.assign(blank(), JSON.parse(t));
    localStorage.setItem(KEY + ':probe', '1'); localStorage.removeItem(KEY + ':probe');
  } catch (e) { storeOK = false; }
}
function save() {
  S.updated = Date.now();
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { storeOK = false; }
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* backup codes: plain text, no server */
const CODE = 'BP1.';
function encodeState() { return CODE + btoa(unescape(encodeURIComponent(JSON.stringify(S)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function decodeState(code) {
  try {
    let c = String(code).trim().replace(/^.*BP1\./s, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (c.length % 4) c += '=';
    const o = JSON.parse(decodeURIComponent(escape(atob(c))));
    return o && typeof o === 'object' && o.v ? Object.assign(blank(), o) : null;
  } catch (e) { return null; }
}
function mergeState(o) {
  for (const k of ['days', 'skills', 'read', 'tried', 'checks', 'done', 'habits', 'weekdone']) for (const x in o[k]) if (o[k][x]) S[k][x] = o[k][x];
  { const have = new Set(S.list.map((e) => e.id)); for (const e of o.list || []) if (!have.has(e.id)) S.list.push(e); }
  for (const x in o.planner) if (o.planner[x] && !S.planner[x]) S.planner[x] = o.planner[x];
  if (!S.name) S.name = o.name; if (!S.start) S.start = o.start; S.seen = true;
}

/* ================= helpers ================= */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function fmt(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[Creator:\s*(.+?)\]/g, '<span class="gap"><b>For you to fill in:</b> $1</span>')
    .replace(/\s*\[(S\d+(?:,\s*S\d+)*)\]/g, (m, g) => ' ' + g.split(/,\s*/).map((x) => { const n = x.slice(1); return `<button class="cite" data-act="cite" data-n="${n}" aria-label="Source ${n}">${n}</button>`; }).join(''));
}
const plain = (s) => s.replace(/\*\*/g, '').replace(/\s*\[S[\d,\sS]+\]/g, '');
const pad = (n) => String(n).padStart(2, '0');
const dkey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dkey(new Date());
const parseD = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const niceDay = (k) => k === today() ? 'Today' : k === dkey(new Date(Date.now() - 864e5)) ? 'Yesterday' : parseD(k).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
const niceTime = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const localInput = (d) => `${dkey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const DAYS = BOOK.plan.length;
const WEEKS = Array.from({ length: Math.ceil(DAYS / 7) }, (_, w) => [w * 7 + 1, Math.min(DAYS, w * 7 + 7)]);
const HAS = { plan: DAYS > 0, tracker: !!BOOK.tools.tracker, planner: !!BOOK.tools.planner, stalls: !!BOOK.stalls, help: !!BOOK.whoToCall, facts: BOOK.facts.length > 0 };
const nextDay = () => { for (let d = 1; d <= DAYS; d++) if (!S.days[d]) return d; return 0; };
const doneCount = () => BOOK.plan.filter((p) => S.days[p.day]).length;
const chapters = BOOK.chapters.filter((c) => c.num);
const chById = (id) => BOOK.chapters.find((c) => c.id === id);
const who = () => S.name ? esc(S.name) : 'you';
function ago(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return [m, m === 1 ? 'minute' : 'minutes'];
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return [`${h}h ${pad(r)}m`, ''];

/* ================= routing ================= */

// Toby build 42: a typed book has its own two middle tabs; a care book calls the Track tab "Log".
const TYPE = BOOK.type || '';

const TABS = (TYPE && TYPE !== 'care'
  ? [['today', 'Today', IC.today], ...BOOK.tabs.map(([id, l]) => [id, l, TYPE_ICONS[id] || IC.list]), ['book', 'Read', IC.book], ['yours', 'Yours', IC.yours]]
  : [['today', 'Today', IC.today], HAS.plan && ['plan', 'Plan', IC.plan], TRACK.length && ['track', TYPE === 'care' ? 'Log' : 'Track', IC.track], ['book', 'Read', IC.book], ['yours', 'Yours', IC.yours]]).filter(Boolean);
const YOURS = [['list', 'Your list'], ['facts', 'Did you know?'], ['say', 'Say this, not that'], ['stalls', BOOK.stallsTitle || 'When it stalls'], ['help', 'Who to call'], ['sources', 'Sources'], ['backup', 'Backup and partner']];
let route = 'today';
function tabOf(r) {
  if (r === 'track' || TRACK.some((t) => t[0] === r)) return 'track';
  if (r === 'book' || chById(r)) return 'book';
  if (r === 'yours' || YOURS.some((t) => t[0] === r)) return 'yours';
  return r;
}
function go(r, keepScroll) {
  if (location.hash.slice(1) !== r) { try { history.pushState(null, '', '#' + r); } catch (e) { location.hash = r; } }

}
function fromHash() {
  const h = location.hash.slice(1);

    try { history.replaceState(null, '', location.pathname + location.search + '#backup'); } catch (e) {}

    if (decodeState(h)) { document.getElementById('incode').value = h; toast('The code from the link is ready below. Choose Add to mine or Replace mine.'); }

  }
  if ((h || 'today') === route && document.getElementById('view').innerHTML) return;
  route = h || 'today'; render();
}
window.addEventListener('hashchange', () => { fromHash(); window.scrollTo(0, 0); });
window.addEventListener('popstate', fromHash);

/* ================= views ================= */
const V = {};

V.today = () => {
  const n = nextDay(), p = BOOK.plan.find((x) => x.day === n), done = doneCount();

/* ---- chapter rendering ---- */
function blocksHtml(ch) {
  const out = []; const B = ch.blocks; let sec = 0;
  for (let i = 0; i < B.length; i++) {
    const b = B[i], id = ch.id + '-' + i;
    switch (b.t) {
      case 'p': out.push(`<p>${fmt(b.text)}</p>`); break;
      case 'fig': if (!b.missing) out.push(`<figure class="fig${b.svg ? ' svg' : ''}">${b.svg ? `<span class="swipe">Swipe to see all of it</span><div class="scroller">${b.svg}</div>` : `<img src="${b.src}" alt="${esc(b.alt)}" width="${b.w}" height="${b.h}">`}${b.caption ? `<figcaption>${fmt(b.caption)}</figcaption>` : ''}</figure>`); break;
      case 'h3': out.push(`<h3 id="sec-${ch.id}-${sec++}" tabindex="-1">${fmt(b.text)}</h3>`); break;
      case 'ul': case 'ol': out.push(`<ul class="plain">${b.items.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul>`); break;
      case 'quote': out.push(`<div class="blk quote"><p>${fmt(b.text)}</p></div>`); break;
      case 'from': out.push(`<div class="blk from"><h4>${fmt(b.title)}</h4><p>${fmt(b.text)}</p></div>`); break;
      case 'key': out.push(`<div class="blk key on-gold"><h4>Key idea</h4><p>${fmt(b.text)}</p></div>`); break;
      case 'redflag': out.push(`<div class="blk flag"><h4>Red flag</h4><p>${fmt(b.text)}</p></div>`); break;
      case 'safety': out.push(`<div class="blk safe"><h4>Safety note</h4><p>${fmt(b.text)}</p></div>`); break;
      case 'before': case 'after': {
        if (b.t === 'before' && B[i + 1] && B[i + 1].t === 'after') { out.push(`<div class="blk ba"><div class="b"><h4>Before</h4><p>${fmt(b.text)}</p></div><div class="a on-dark"><h4>After</h4><p>${fmt(B[i + 1].text)}</p></div></div>`); i++; }
        else out.push(`<div class="blk ba"><div class="${b.t[0]}"><h4>${b.t === 'before' ? 'Before' : 'After'}</h4><p>${fmt(b.text)}</p></div></div>`);
        break; }
      case 'stat': { const group = [b]; while (B[i + 1] && B[i + 1].t === 'stat') group.push(B[++i]);
        out.push(`<div class="statrow n${group.length}">${group.map((s) => `<div class="stat"><b>${esc(s.value)}</b><span>${fmt(s.text)}</span></div>`).join('')}</div>`); break; }
      case 'steps': out.push(`<div class="blk steps"><ol>${b.items.map((x) => `<li>${fmt(x)}</li>`).join('')}</ol></div>`); break;
      case 'timeline': out.push(`<div class="blk steps"><ol>${b.items.map((x) => `<li>${fmt(x.replace(/^(Week \d+):/, '**$1.**'))}</li>`).join('')}</ol></div>`); break;
      case 'checklist': out.push(`<div class="blk check"><h4>${fmt(b.title)}</h4>${b.items.map((x, j) => `<button data-act="check" data-k="${id}-${j}" aria-pressed="${!!S.checks[id + '-' + j]}"><span class="tick box">${IC.check}</span><span class="tx">${fmt(x).replace(/<button class="cite"/g, '<span role="button" tabindex="0" class="cite"').replace(/<\/button>/g, '</span>')}</span></button>`).join('')}</div>`); break;
      case 'say': out.push(`<div class="say">${b.rows.map((r) => `<div class="pair"><div class="bubble yes on-dark"><small>${esc(b.head[1 - (/^instead/i.test(b.head[0]) ? 0 : 1)])}</small>${fmt(/^instead/i.test(b.head[0]) ? r[1] : r[0])}</div><div class="bubble no"><small>${esc(/^instead/i.test(b.head[0]) ? b.head[0] : b.head[1])}</small>${fmt(/^instead/i.test(b.head[0]) ? r[0] : r[1])}</div></div>`).join('')}</div>`); break;
      case 'clock': out.push(`<div class="clock">${b.rows.map((r) => `<div><time>${esc(r[0])}</time><p>${fmt(r[1])}</p></div>`).join('')}</div>`); break;
      case 'table': out.push(tableHtml(b)); break;
      case 'plan': out.push(`<div class="toolcard"><div><b>Your ${DAYS} day plan</b><span>All ${DAYS} days, with a tick for each one. ${doneCount()} ticked so far.</span></div><button class="btn" data-go="plan">Open the plan</button></div>`); break;
      case 'tool': { const m = { tracker: 'Tick each step, week by week.', planner: 'Type your own week. It saves as you go.', list: 'Questions, numbers, things to buy.' };
        out.push(`<div class="toolcard"><div><b>${fmt(b.title)}</b><span>${m[b.tool] || ''}</span></div><button class="btn" data-go="${b.tool}">Open it</button></div>`); break; }
      case 'try': out.push(`<div class="blk try on-gold"><h4>Try tonight</h4><p>${fmt(b.text)}</p><div class="row"><button class="btn small" data-act="tried" data-k="${ch.id}" aria-pressed="${!!S.tried[ch.id]}">${S.tried[ch.id] ? IC.check + ' Tried it' : 'I tried this'}</button></div></div>`); break;
      case 'remember': out.push(`<div class="blk remember on-dark"><h4>Remember</h4><ul>${b.items.map((x) => `<li>${fmt(x)}</li>`).join('')}</ul></div>`); break;
      case 'facts': out.push(`<div class="facts"><h3>Did you know?</h3><div class="factgrid on-gold">${b.items.map((x) => `<div class="f">${fmt(x)}</div>`).join('')}</div></div>`); break;
      case 'recipe': { const r = BOOK.recipes.find((x) => x.chId === ch.id && x.title === b.title); if (r) out.push(recipeCard(r, false)); break; }
      case 'project': { const r = BOOK.projects.find((x) => x.chId === ch.id && x.title === b.title); if (r) out.push(projectCard(r, false)); break; }
      case 'week': out.push(`${b.title ? `<h4 style="font-size:18px;margin:22px 0 10px">${fmt(b.title)}</h4>` : ''}<div class="xweek">${b.items.map((x) => `<div class="xday"><small>${esc(x.day)}</small><p>${fmt(x.job)}</p></div>`).join('')}</div>`); break;
    }
  }
  return out.join('');
}

/* ================= Toby build 42: views for typed books ================= */
const metaHtml = (meta) => meta.length ? `<div class="xmeta">${meta.map((m) => `<span>${m.k ? `<b>${esc(m.k)}</b> ` : ''}${fmt(m.v)}</span>`).join('')}</div>` : '';
const listTable = (items, heads, cls = '') => { if (!items.length) return ''; const cols = Math.max(...items.map((r) => r.length)); const head = heads[cols] || heads[2];
  return `<table class="xlist ${cls}"><thead><tr>${head.slice(0, cols).map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${items.map((r) => `<tr>${Array.from({ length: cols }, (_, i) => `<td>${fmt(r[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody></table>`; };
// Servings: the first number in "Makes" or "Serves". Amounts are scaled in every cell after the first.
const FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3, '⅛': .125 };
const baseServes = (r) => { const m = r.meta.find((x) => /^(makes|serves|servings|yield)/i.test(x.k)); const n = m && parseFloat(m.v); return n > 0 ? n : 0; };
function niceAmount(v) {
  if (v >= 10) return String(Math.round(v));
  const whole = Math.floor(v), rest = v - whole;
  const pick = Object.entries(FRAC).concat([['', 0], ['', 1]]).reduce((a, b) => Math.abs(b[1] - rest) < Math.abs(a[1] - rest) ? b : a);
  if (pick[1] === 1) return String(whole + 1);
  if (Math.abs(pick[1] - rest) > .06) return String(Math.round(v * 10) / 10);
  return (whole ? String(whole) : pick[0] ? '' : '0') + pick[0];
}
function scaleText(text, k) {
  if (k === 1) return text;
  return text.replace(/(^|[^\w.\[S])(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛])?(?=\s*[A-Za-z°%]|\s*$)/g, (m, pre, num, fr) => {
    if (!num && !fr) return m;
    const v = (num ? parseFloat(num) : 0) + (fr ? FRAC[fr] : 0);
    return pre + niceAmount(v * k) + '\u0000' + (v * k > 1 ? 'p' : 's');
  }).replace(/\u0000([ps])(\s*)(cups?)\b/g, (m, n, sp, w) => sp + (n === 'p' ? 'cups' : 'cup')).replace(/\u0000[ps]/g, '');
}
function recipeCard(r, full) {
  const base = baseServes(r), now = S.serves[r.id] || base, k = base ? now / base : 1;
  const items = r.items.map((row) => row.map((c, i) => (i ? scaleText(c, k) : c)));
  const steps = r.steps.length ? `<ol class="xsteps">${r.steps.map((x, j) => { const key = r.id + '-s' + j, on = S.checks[key];
    return `<li class="${on && full ? 'done' : ''}"><span class="n">${j + 1}</span><p>${fmt(x)}</p>${full ? tickBtn(on, 'check', `data-k="${key}"`, 'Step ' + (j + 1) + ' done', 'box') : ''}</li>`; }).join('')}</ol>` : '';
  return `<section class="xcard" id="${r.id}"><div class="xhead"><div class="xkind">Recipe${r.ch ? ' · Chapter ' + r.ch : ''}</div><h2>${fmt(r.title)}</h2>${metaHtml(r.meta)}</div>
    <div class="xbody ${items.length && steps ? 'two' : ''}">${items.length ? `<div>${full && base ? `<div class="xserve"><span>Amounts for</span><button data-act="serve" data-id="${r.id}" data-d="-1" aria-label="Fewer">−</button><b>${niceAmount(now)}</b><button data-act="serve" data-id="${r.id}" data-d="1" aria-label="More">+</button>${k !== 1 ? `<button class="linkbtn" data-act="serve" data-id="${r.id}" data-d="0" style="width:auto;background:none;font-size:14.5px">Back to ${niceAmount(base)}</button>` : ''}</div>` : ''}${listTable(items, { 1: ['Ingredient'], 2: ['Ingredient', 'Amount'], 3: ['Ingredient', 'Metric', 'US'], 4: ['Ingredient', 'Metric', 'US', 'Note'] }, 'amt')}</div>` : ''}${steps ? `<div>${steps}</div>` : ''}</div>
    ${full ? `<div class="xfoot">${timersOf(r).length ? `<button class="btn small" data-go="timer">${IC.timer} ${timersOf(r).length} timer${timersOf(r).length > 1 ? 's' : ''} for this</button>` : ''}<button class="linkbtn" data-go="${r.chId}">Read chapter ${r.ch} ${IC.fwd}</button></div>` : `<div class="xfoot"><button class="btn small line" data-go="recipes">Open in Recipes</button></div>`}</section>`;
}
V.recipes = () => `<div class="col"><div class="pagehead"><h1>Recipes</h1><p>Every recipe in the book. Change the amounts with − and +, and tick the steps as you go.</p></div>

// Timers: every step that names a time ("25 minutes", "1 hour", "45 min"), plus one of your own.
const T = {}; let tickId = 0;
function minutesIn(text) { const m = plain(text).match(/(\d+(?:\.\d+)?)\s*(?:to\s*\d+\s*)?(hours?|hrs?|minutes?|mins?)\b/i); return m ? Math.round(parseFloat(m[1]) * (/^h/i.test(m[2]) ? 60 : 1)) : 0; }

const clockText = (s) => { const a = Math.abs(s), h = Math.floor(a / 3600), m = Math.floor(a % 3600 / 60), x = a % 60; return (s < 0 ? '+' : '') + (h ? h + ':' + pad(m) : m) + ':' + pad(x); };
const minsText = (m) => m < 60 ? m + ' min' : m % 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m / 60 + (m === 60 ? ' hour' : ' hours');
const left = (id) => T[id] ? Math.round((T[id].end - Date.now()) / 1000) : null;
// the sound is set up on the Start click, because browsers only allow sound that a tap started
function soundOn() { try { beep.a = beep.a || new (window.AudioContext || window.webkitAudioContext)(); beep.a.resume && beep.a.resume(); } catch (e) {} }
function beep() { try { const a = beep.a || new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime); o.start(); o.stop(a.currentTime + .6); } catch (e) {} }

  let running = 0;
  for (const id in T) { const s = left(id); running++; const el = document.getElementById('tm-' + id); if (el) { el.textContent = clockText(s); el.closest('.xtimer').classList.toggle('over', s <= 0); }
    if (s <= 0 && !T[id].rang) { T[id].rang = true; beep(); toast(T[id].label + ': time is up'); } }
  if (!running) { clearInterval(tickId); tickId = 0; }
}
function timerCard(t) { const s = left(t.id), on = s !== null;
  return `<div class="xtimer ${on ? 'run' : ''} ${on && s <= 0 ? 'over' : ''}"><div><small>${esc(plain(t.title))}${t.n ? ' · step ' + t.n : ''}</small><p>${fmt(t.step)}</p></div><div class="xclock" id="tm-${t.id}">${clockText(on ? s : t.mins * 60)}</div>
    <div class="row">${on ? `<button class="btn small line" data-act="tstop" data-id="${t.id}">Stop</button>` : `<button class="btn small" data-act="tstart" data-id="${t.id}" data-m="${t.mins}" data-l="${esc(plain(t.title))}">Start ${minsText(t.mins)}</button>`}</div></div>`; }
V.timer = () => { const all = BOOK.recipes.flatMap(timersOf), own = Object.keys(T).filter((id) => id.startsWith('own-')).map((id) => ({ id, mins: T[id].mins, step: 'Your own timer', title: T[id].label, n: 0 }));

  if (g) { closeLayer(); go(g.dataset.go); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  const rer = () => { const y = window.scrollY; save(); render(); window.scrollTo(0, y); };
  switch (a) {
    case 'scrim': if (e.target === el) closeLayer(); break;
    case 'close': closeLayer(); break;
    case 'ok': { const f = confirmBox.fn; closeLayer(); f && f(); break; }
    case 'cite': e.preventDefault(); e.stopPropagation(); citeSheet(d.n); break;
    case 'day': S.days[d.d] = !S.days[d.d]; if (S.days[d.d]) toast(`Day ${d.d} ticked`); rer(); break;
    case 'skill': S.skills[d.k] = !S.skills[d.k]; rer(); break;
    case 'pld': planDay = +d.i; render(); break;
    case 'check': S.checks[d.k] = !S.checks[d.k]; el.setAttribute('aria-pressed', !!S.checks[d.k]); { const li = el.closest('.xsteps li'); if (li) li.classList.toggle('done', !!S.checks[d.k]); } save(); break;
    case 'serve': { const r = BOOK.recipes.find((x) => x.id === d.id), base = baseServes(r), now = S.serves[d.id] || base, step = base >= 4 ? 1 : .5;
      if (+d.d === 0) delete S.serves[d.id]; else S.serves[d.id] = Math.max(step, Math.min(base * 10, now + step * +d.d)); rer(); break; }
    case 'tstart': T[d.id] = { end: Date.now() + (+d.m) * 60000, mins: +d.m, label: d.l || 'Timer' }; soundOn(); if (!tickId) tickId = setInterval(timerTick, 1000); rer(); break;
    case 'tstop': delete T[d.id]; rer(); break;
    case 'pjdone': if (S.done[d.id]) delete S.done[d.id]; else { S.done[d.id] = today(); toast('Project finished'); } rer(); break;
    case 'wk': S.weekdone[d.k] = !S.weekdone[d.k]; if (!S.weekdone[d.k]) delete S.weekdone[d.k]; rer(); break;
    case 'habit': S.habits[d.k] = !S.habits[d.k]; if (!S.habits[d.k]) delete S.habits[d.k]; rer(); break;
    case 'jump': { e.preventDefault(); const go2 = () => { const t = document.getElementById(d.id); if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); };
      if (d.to && route !== d.to) { go(d.to); setTimeout(go2, 30); } else go2(); break; }
    case 'sec': { const h = document.getElementById(d.id); if (h) { h.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); h.focus({ preventScroll: true }); } break; }
    case 'tried': S.tried[d.k] = !S.tried[d.k]; rer(); break;
    case 'readnext': S.read[d.id] = true; save(); go(d.next); break;
    case 'todo': { const x = S.list.find((i) => i.id === d.id); if (x) x.done = !x.done; rer(); break; }
    case 'tododel': S.list = S.list.filter((i) => i.id !== d.id); rer(); break;
    case 'starter': S.list.push({ id: uid(), text: d.t, done: false }); rer(); break;
    case 'setup': setupSheet(false); break;
    case 'skipsetup': S.seen = true; save(); closeLayer(); break;
    case 'copycode': copyText(encodeState(), 'Backup code copied', document.getElementById('code')); break;
    case 'copylink': copyText(location.href.split('#')[0] + '#' + encodeState(), 'Link copied'); break;
    case 'merge': case 'replace': {
      const o = decodeState(document.getElementById('incode').value);
      if (!o) { toast('That code could not be read. Copy the whole code and try again.'); break; }
      const nd = Object.values(o.days).filter(Boolean).length, nr = Object.values(o.read || {}).filter(Boolean).length;
      const summary = `${nd} plan ${nd === 1 ? 'day' : 'days'} ticked and ${nr} ${nr === 1 ? 'chapter' : 'chapters'} read`;
      if (a === 'merge') confirmBox('Add to mine?', `The code holds ${summary}. Your own ticks and notes stay, and theirs are added.`, 'Add to mine', () => { mergeState(o); save(); render(); toast('Added to your progress'); });
      else confirmBox('Replace mine?', `The code holds ${summary}. Everything on this device will be swapped for it.`, 'Replace mine', () => { S = o; S.seen = true; save(); render(); toast('Progress replaced'); }, true);
      break; }
    case 'reset': confirmBox('Clear everything?', 'Every tick, log entry and note on this device will be removed. This cannot be undone, so copy a backup code first if you might want it back.', 'Clear everything', () => { S = blank(); S.seen = true; save(); go('today'); toast('Cleared'); }, true); break;
  }
});
function copyText(text, msg, field) {
  const fallback = () => { if (field) { field.focus(); field.select(); toast('Code selected. Press copy.'); } else toast('Copy did not work here. Use the backup code instead.'); };
  try { navigator.clipboard.writeText(text).then(() => toast(msg), fallback); } catch (e) { fallback(); }
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLayer();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('span.cite')) { e.preventDefault(); e.stopPropagation(); citeSheet(e.target.dataset.n); }
});
document.addEventListener('input', (e) => {
  const b = e.target.dataset.bind; if (!b) return; const k = e.target.dataset.k, v = e.target.value;
  if (b === 'planner') { if (v.trim()) S.planner[k] = v; else delete S.planner[k]; }
  save();
});
document.addEventListener('submit', (e) => {
  e.preventDefault(); const f = e.target, kind = f.dataset.form;
  if (kind === 'list') { const t = f.t.value.trim(); if (t) { S.list.push({ id: uid(), text: t, done: false }); save(); render(); document.querySelector('[data-form=list] input').focus(); } }
  if (kind === 'timer') { const m = Math.max(1, Math.min(720, parseInt(f.m.value, 10) || 0)); const id = 'own-' + uid(); T[id] = { end: Date.now() + m * 60000, mins: m, label: 'Your ' + m + ' minute timer' }; soundOn(); if (!tickId) tickId = setInterval(timerTick, 1000); render(); }
  if (kind === 'setup') { S.name = f.name.value.trim().slice(0, 30); S.seen = true; save(); closeLayer(); render(); }
});

/* ================= start ================= */
load();
(function boot() {
  fromHash();
  if (!S.seen && route === 'today') setupSheet(true);
})();
</script>
</body>
</html>
