name: Build desktop downloads
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a private community prerelease after all builds pass
        type: boolean
        default: false
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: windows-2022
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:assets
      - run: node --test test/platform-runtime.test.mjs
      - run: npm run dist -- --${{ matrix.target }} --${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged application
        if: runner.os != 'Linux'
        run: node test/release-smoke.mjs
      - name: Check packaged application on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/*.deb
          GRATIS_TEST_APP=/opt/Gratis/gratis xvfb-run -a dbus-run-session -- node test/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Gratis-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish private community preview
        env:
          GH_TOKEN: ${{ secrets.GRATIS_RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate --jq .isPrivate)" = true
          if [[ "$RELEASE_TAG" != v* ]]; then RELEASE_TAG="v$(node -p 'require("./package.json").version')"; fi
          cd installers
          sha256sum * > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Gratis ${RELEASE_TAG#v} community preview" --notes-file ../docs/RELEASE_NOTES.md ./*
